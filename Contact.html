<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(
        135deg,
        black 30%,
        gold 55%,
        black 100%
    );
    min-height:100vh;
}

/* Navigation */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:linear-gradient(
        90deg,
        yellow 30%,
        gold 50%,
        orange 100%
    );
    box-shadow:0 4px 20px rgba(255,212,0,.35);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:black;
}

.logo span{
    color:white;
}

.nav-links{
    display:flex;
    gap:20px;
}

.nav-links a{
    text-decoration:none;
    color:black;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

.nav-links a:hover{
    background:black;
    color:#FFD400;
    transform:translateY(-2px);
}

/* Contact Box */

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:85vh;
}

.contact-box{
    background:white;
    color:black;
    width:90%;
    max-width:700px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,215,0,.4);
}

.contact-box h1{
    text-align:center;
    margin-bottom:10px;
}

.contact-box p{
    text-align:center;
    margin-bottom:30px;
    color:#555;
}

form{
    display:flex;
    flex-direction:column;
}

input,
textarea{
    padding:15px;
    margin-bottom:20px;
    border:2px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

input:focus,
textarea:focus{
    border-color:#FFD700;
    outline:none;
}

textarea{
    resize:none;
    height:150px;
}

button{
    background:#FFD700;
    color:black;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:black;
    color:#FFD700;
}

footer{
    text-align:center;
    padding:20px;
    color:white;
}

</style>
</head>

<body>

<nav>

    <div class="logo">
        Ian<span>.</span>
    </div>

    <div class="nav-links">
        <a href="/Users/admin/Desktop/Ian_Website/web pages/MyPortfolio:Home.html">Home</a>
        <a href="/Users/admin/Desktop/Ian_Website/web pages/AboutMe.html">About Me</a>
        <a href="/Users/admin/Desktop/Ian_Website/web pages/Contact.html">Contact</a>
        <a href="/Users/admin/Desktop/Ian_Website/web pages/Content.html">Content</a>
    </div>

</nav>

<div class="container">

    <div class="contact-box">

        <h1>Contact Me</h1>

        <p>Have a question or just want to say hello? Fill out the form below!</p>

        <form>

            <input type="text" placeholder="Your Name" required>

            <input type="email" placeholder="Your Email" required>

            <textarea placeholder="Your Message..." required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</div>

<footer>
    © 2026 Ian | Portfolio Website
</footer>

</body>
</html>
