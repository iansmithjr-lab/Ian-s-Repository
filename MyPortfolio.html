       0 0 10px #FFD400,

   color:#FFD400;

   color:white;

   text-decoration:none;
   padding:30px 100px;
   border-radius:6px;
   font-size:24px;
   font-weight:bold;
   transition:0.3s;

.btn:hover{

   color:#000000;
